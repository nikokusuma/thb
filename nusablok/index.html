<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a2160">
<title>NusaBlok · Petualangan Belajar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a2160;--paper:#fffaf0;--gold:#ffc233;--green:#2fbf71;--red:#e5484d;--blue:#3a6fe0;--sky:#8fd6ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);font-family:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
input{-webkit-user-select:text;user-select:text}
#game{position:fixed;inset:0}
.nb-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
.hide{display:none!important}

/* ---------- komponen dasar ---------- */
.btn{border:3px solid var(--ink);background:var(--gold);border-radius:14px;padding:10px 20px;font-weight:700;font-size:18px;box-shadow:0 5px 0 var(--ink);transition:transform .06s,box-shadow .06s;line-height:1.1}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.green{background:#5fd68d}.btn.blue{background:#8fb3ff}.btn.white{background:#fff}.btn.red{background:#ff9a9a}.btn.sm{padding:6px 12px;font-size:15px;box-shadow:0 3px 0 var(--ink)}.btn.big{font-size:22px;padding:14px 26px}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--paper);border:4px solid var(--ink);border-radius:20px;box-shadow:0 7px 0 var(--ink);padding:20px}
.inp{width:100%;border:3px solid var(--ink);border-radius:12px;padding:11px 14px;font-size:19px;background:#fff;outline:none;font-weight:600}
.inp:focus{box-shadow:0 0 0 4px #ffc23366}
.lbl{display:block;font-weight:700;font-size:15px;margin:12px 0 5px}
.err{color:#b3202a;font-weight:700;min-height:22px;margin-top:8px;font-size:15px}
.mut{opacity:.7;font-size:14px}
.row{display:flex;gap:10px;align-items:center}.row.wrap{flex-wrap:wrap}.grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:3px solid var(--ink);background:#fff;font-weight:700;font-size:14px}

/* ---------- layar penuh ---------- */
#screen{position:fixed;inset:0;z-index:50;display:none;overflow:auto;-webkit-overflow-scrolling:touch}
#screen.on{display:block}
.scr{min-height:100%;display:flex;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) 14px 24px}
.sky{background:linear-gradient(#5fb9f5 0%,#9fdcff 55%,#d4f1ff 72%);position:relative;overflow:hidden}
.sky::after{content:"";position:absolute;left:0;right:0;bottom:0;height:20%;background:linear-gradient(#5fbf4b 0 22%,#8a5a35 22%);border-top:4px solid var(--ink);pointer-events:none}
.sky .cl{position:absolute;background:#fff;border:4px solid #fff;border-radius:8px;box-shadow:inset 0 -8px 0 #dfeeff;animation:drift 60s linear infinite;opacity:.95}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.logo{font-weight:700;font-size:clamp(40px,9vw,64px);text-align:center;letter-spacing:1px;margin:0 0 4px;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
.logo b{color:var(--gold)}
.sub{text-align:center;font-weight:600;margin-bottom:14px}
.login{width:min(430px,100%);position:relative;z-index:2}
.tabs{display:flex;gap:8px;margin-bottom:6px}
.tabs button{flex:1;border:3px solid var(--ink);background:#fff;border-radius:12px;padding:8px;font-weight:700;font-size:17px}
.tabs button.on{background:var(--gold);box-shadow:0 3px 0 var(--ink)}
.skins{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.skin{border:3px solid transparent;background:#fff;border-radius:10px;padding:4px 0;display:flex;justify-content:center;border-color:#c9cde8}
.gseg{display:flex;gap:8px;margin:0 0 8px}.gseg button{flex:1;font:inherit;font-weight:800;font-size:15px;color:var(--ink);background:#fff;border:3px solid #c9cde8;border-radius:12px;padding:6px 4px;cursor:pointer}.gseg button.on{border-color:var(--ink);background:#fff2c2;box-shadow:0 3px 0 var(--ink)}
.skin.on{border-color:var(--ink);background:#fff2c2;transform:translateY(-2px);box-shadow:0 3px 0 var(--ink)}
.kls{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.kls button{border:3px solid var(--ink);background:#fff;border-radius:10px;padding:8px 0;font-weight:700;font-size:19px}
.kls button.on{background:var(--gold);box-shadow:0 3px 0 var(--ink)}
.footlnk{text-align:center;margin-top:14px;position:relative;z-index:2}
.footlnk button{background:#ffffffd0;border:3px solid var(--ink);border-radius:999px;padding:6px 16px;font-weight:700}
.demo-pill{position:fixed;top:10px;right:10px;z-index:60;background:#ff8c8c;border:3px solid var(--ink);border-radius:999px;padding:3px 12px;font-weight:700;font-size:13px}

/* ---------- tes penempatan ---------- */
.test{width:min(640px,100%)}
.pbar{height:16px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden;margin:6px 0 14px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#5fd68d,#2fbf71);transition:width .3s}
.qtext{font-size:clamp(20px,4.4vw,27px);font-weight:700;line-height:1.3;margin:6px 0 16px}
.opts{display:grid;gap:10px}
.opt{border:3px solid var(--ink);background:#fff;border-radius:14px;padding:13px 16px;font-size:clamp(17px,3.8vw,22px);font-weight:600;text-align:left;box-shadow:0 4px 0 var(--ink);transition:transform .06s,box-shadow .06s,background .15s}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.opt.pick{background:#ffe9a0}.opt.ok{background:#8ae6ad}.opt.no{background:#ffadad;animation:shake .35s}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.subhead{display:flex;align-items:center;gap:10px;font-weight:700}
.subhead .ik{width:42px;height:42px;border-radius:12px;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:24px}
.hasil{text-align:center}
.hasil .lv{font-size:clamp(54px,14vw,92px);font-weight:700;line-height:1;color:var(--gold);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;display:none}
#hud.on{display:block}
#hud>*{pointer-events:auto}
#hud>.xh,#hud>.shot,#hud>.hurt,#hud>.boss,#hud>.hhp,#hud>.rc,#hud>.dark,#hud>.fade{pointer-events:none}
.hud-tl{position:absolute;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:8px;pointer-events:none!important}
.prof{pointer-events:auto;display:flex;align-items:center;gap:8px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:5px 10px 5px 6px;box-shadow:0 4px 0 var(--ink);min-width:150px}
.prof .av{width:36px;height:42px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.prof b{display:block;font-size:15px;line-height:1.1;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prof small{font-weight:600;font-size:13px}
#mini{width:112px;height:112px;border:4px solid var(--ink);border-radius:50%;box-shadow:0 4px 0 var(--ink);background:#3c7cd6;pointer-events:auto}
.hud-tr{position:absolute;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));display:flex;gap:8px}
.ib{width:46px;height:46px;border-radius:14px;border:3px solid var(--ink);background:var(--paper);font-size:22px;box-shadow:0 4px 0 var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.wp{position:absolute;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);display:none;align-items:center;gap:8px;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:5px 14px 5px 8px;box-shadow:0 4px 0 var(--ink);font-weight:700;font-size:14px;max-width:calc(100vw - 330px);pointer-events:none!important}
.wp.on{display:flex}
.wp .ar{width:30px;height:30px;transition:transform .1s}
.wp span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-bl{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom))}
.online{background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:3px 12px;font-weight:700;font-size:13px;box-shadow:0 3px 0 var(--ink);pointer-events:none}
.hud-br{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.jump{width:78px;height:78px;border-radius:50%;border:4px solid var(--ink);background:#8fb3ff;font-size:30px;font-weight:700;box-shadow:0 6px 0 var(--ink);padding:0}
.jump:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.talk{border:4px solid var(--ink);background:var(--gold);border-radius:18px;padding:12px 20px;font-size:21px;font-weight:700;box-shadow:0 6px 0 var(--ink);animation:pulse 1s ease-in-out infinite;display:none;max-width:56vw}
.talk.on{display:block}.talk small{display:block;font-size:13px;font-weight:600}
@keyframes pulse{50%{transform:scale(1.07)}}
.joyring{position:fixed;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:4px solid #ffffffcc;background:#ffffff33;pointer-events:none;z-index:11;display:none}
.joyring i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border-radius:50%;background:#ffffffdd;border:4px solid var(--ink)}
.banner{position:fixed;left:50%;top:22%;transform:translate(-50%,-14px);opacity:0;z-index:12;background:var(--paper);border:4px solid var(--ink);border-radius:18px;padding:10px 24px;box-shadow:0 6px 0 var(--ink);font-weight:700;font-size:clamp(20px,5vw,30px);text-align:center;pointer-events:none;transition:all .4s}
.banner.on{opacity:1;transform:translate(-50%,0)}.banner small{display:block;font-size:.55em;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 96px);transform:translate(-50%,10px);opacity:0;z-index:70;background:var(--ink);color:#fff;border-radius:14px;padding:10px 18px;font-weight:600;font-size:16px;text-align:center;max-width:90vw;transition:all .25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.help{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:45;width:min(380px,92vw)}
.help h3{margin:0 0 8px}.help ul{margin:0 0 12px;padding-left:20px;line-height:1.5;font-weight:600}

/* ---------- jendela (dialog) ---------- */
#modal{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;background:#10163a66;padding:12px}
#modal.on{display:flex}
@media(min-width:720px){#modal{align-items:center}}
.dlg{width:min(640px,100%);max-height:calc(100dvh - 24px);overflow:auto;animation:pop .22s ease-out}
@keyframes pop{from{transform:translateY(30px);opacity:0}}
.npcname{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.npcname .tag{border:3px solid var(--ink);border-radius:10px;padding:2px 10px;font-weight:700;color:#fff}
.story{font-size:clamp(17px,3.8vw,21px);font-weight:600;line-height:1.4;margin:6px 0 16px}
.dots{display:flex;gap:6px}.dots i{width:14px;height:14px;border-radius:50%;border:3px solid var(--ink);background:#fff}.dots i.on{background:var(--gold)}.dots i.ok{background:#5fd68d}.dots i.no{background:#ff8c8c}
.stars{font-size:54px;letter-spacing:6px;text-align:center;margin:6px 0}
.stars span{display:inline-block;filter:grayscale(1) opacity(.35)}.stars span.on{filter:none;animation:starin .5s both}
@keyframes starin{from{transform:scale(0) rotate(-120deg)}60%{transform:scale(1.4) rotate(10deg)}to{transform:scale(1)}}
.mlist h4{margin:14px 0 6px;display:flex;align-items:center;gap:8px}
.mi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:3px solid var(--ink);background:#fff;border-radius:12px;padding:8px 12px;margin-bottom:6px;font-weight:600;font-size:16px}
.mi .st{margin-left:auto;font-size:15px;white-space:nowrap}
.mi.cur{background:#fff2c2}
.mapbox{position:relative;width:min(100%,520px);aspect-ratio:1;margin:0 auto;border:4px solid var(--ink);border-radius:12px;overflow:hidden;background:#3c7cd6}
.mapbox canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.emos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.progbar{height:14px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}.progbar i{display:block;height:100%;background:var(--gold)}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th,.tbl td{border-bottom:2px solid #d8dcf0;padding:6px 6px;text-align:left}
.tbl th{position:sticky;top:0;background:var(--paper)}
.tbl select{border:2px solid var(--ink);border-radius:8px;padding:2px 4px;background:#fff;font-weight:700}
.load{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:linear-gradient(#5fb9f5,#d4f1ff);font-weight:700;font-size:22px}
.load.on{display:flex}
.cube{width:46px;height:46px;background:#6bbf4b;border:4px solid var(--ink);box-shadow:inset 0 -10px 0 #8a5a35;animation:spin 1.1s ease-in-out infinite}
@keyframes spin{50%{transform:translateY(-16px) rotate(90deg)}to{transform:rotate(180deg)}}
@media(max-width:640px){.wp{left:auto;right:max(10px,env(safe-area-inset-right));top:calc(max(10px,env(safe-area-inset-top)) + 54px);transform:none;max-width:calc(100vw - 130px);font-size:13px}#mini{width:92px;height:92px}.ib{width:40px;height:40px;font-size:19px;border-radius:12px}.hud-tr{gap:5px}.prof{min-width:0}.prof b{max-width:96px}}
.bowwrap{display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:auto}
.bowc{font-weight:800;font-size:15px;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:1px 10px;box-shadow:0 3px 0 var(--ink)}.bowc.zero{background:#ffb4b4}
.bow{width:78px;height:78px;border-radius:50%;border:4px solid var(--ink);background:#7fe39a;font-size:34px;box-shadow:0 6px 0 var(--ink);padding:0;touch-action:none;user-select:none;-webkit-user-select:none}
.bow.hold{transform:translateY(5px);box-shadow:0 1px 0 var(--ink);background:#3fd16a}.bow.tree{background:#ffd27a}.bow.empty{background:#c9cfe0}
.bowrow{display:flex;align-items:flex-end;gap:8px}
.obs{width:48px;height:48px;border-radius:50%;border:4px solid var(--ink);background:#bfe3ff;font-size:22px;box-shadow:0 5px 0 var(--ink);padding:0;touch-action:none;user-select:none;-webkit-user-select:none}
.obs.on{background:#ffd27a;transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.bow.snap{background:#bfe3ff}
.xh.obsx{width:92px;height:92px;margin:-46px 0 0 -46px}.xh.obsx::before{border-radius:14px;border-style:dashed}.xh.obsx b{display:none}
.hhp{display:none;font-size:19px;letter-spacing:1px;background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:0 8px;box-shadow:0 3px 0 var(--ink);width:fit-content;pointer-events:none}.hhp.on{display:block}
.boss{position:fixed;left:50%;top:calc(max(10px,env(safe-area-inset-top)) + 58px);transform:translateX(-50%);z-index:6;display:none;flex-direction:column;align-items:center;gap:2px;width:min(78vw,380px);pointer-events:none}.boss.on{display:flex}
@media (max-width:560px){.boss{left:auto;right:10px;transform:none;top:calc(max(10px,env(safe-area-inset-top)) + 158px);width:min(54vw,230px)}.boss small{font-size:11px}}
.boss b{font-size:15px;color:#fff;text-shadow:0 2px 0 var(--ink),0 0 6px var(--ink)}
.bbar{width:100%;height:16px;border:3px solid var(--ink);border-radius:10px;background:#3a1a1a;overflow:hidden}.bbar i{display:block;height:100%;width:100%;background:linear-gradient(#ff6a5a,#d6342c);transition:width .35s}
.boss.rage .bbar i{background:linear-gradient(#ffb04a,#ff3b1a)}.boss.down .bbar i{background:#777}
.boss small{font-size:12px;font-weight:800;color:#fff;text-shadow:0 2px 0 var(--ink),0 0 5px var(--ink)}
.shot{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:7}.shot.go{animation:shotf .35s ease-out}
@keyframes shotf{0%{opacity:.85}100%{opacity:0}}
.dark{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;transition:opacity .3s;background:radial-gradient(ellipse at center,rgba(0,0,14,0) 22%,rgba(0,0,14,.78) 70%,rgba(0,0,10,.96) 100%)}
.fade{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:#05040c;opacity:0;pointer-events:none;transition:opacity .8s ease}.fade.on{opacity:1;pointer-events:auto}
.fade b{color:#d9c8ff;font-size:19px;text-align:center;padding:0 24px;text-shadow:0 0 12px #7a3df0}
.hurt{position:fixed;inset:0;pointer-events:none;z-index:7;opacity:0;box-shadow:inset 0 0 90px 24px rgba(214,40,40,.85)}.hurt.go{animation:hurtf .5s ease-out}
@keyframes hurtf{0%{opacity:1}100%{opacity:0}}
.xh{position:fixed;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;pointer-events:none;display:none;z-index:5}.xh.on{display:block}
.xh::before{content:"";position:absolute;inset:0;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px var(--ink),inset 0 0 0 2px var(--ink)}
.xh i{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;background:#ff3b3b;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px var(--ink)}
.xh b{position:absolute;left:-8px;right:-8px;top:62px;height:10px;border:3px solid var(--ink);border-radius:8px;background:linear-gradient(90deg,#3fd16a var(--c,0%),#fff var(--c,0%))}
@media(max-height:480px){#mini{display:none}.jump{width:64px;height:64px}.bow{width:64px;height:64px;font-size:28px}.bowc{font-size:13px}}

/* ---- Aktivitas: kumpul barang, memancing, gali, item langka, koleksi ---- */
.rule{background:#fff6d6;border:3px solid var(--ink);border-radius:14px;padding:10px 14px;font-weight:600;line-height:1.45;font-size:16px}
.fakta{background:#e8f6ff;border:3px solid var(--ink);border-radius:14px;padding:10px 14px;font-weight:600;line-height:1.4;font-size:16px;margin:8px 0}
.bigic{width:104px;height:104px;margin:4px auto 0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:62px;background:radial-gradient(circle,#fff 0,var(--c) 70%,transparent 72%);border:4px solid var(--ink);animation:pop .35s ease-out}
.bigic.gold{width:128px;height:128px;font-size:76px;animation:pulse 1.1s ease-in-out infinite;box-shadow:0 0 0 6px #ffd23a88,0 0 34px 8px var(--c)}
.tbar{height:14px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden;margin:8px 0}.tbar i{display:block;height:100%;width:100%;background:#5fd68d}.tbar i.low{background:#ff6b6b}
.actbar{position:fixed;left:50%;bottom:calc(max(18px,env(safe-area-inset-bottom)) + 8px);transform:translateX(-50%);z-index:11;display:none;flex-direction:column;align-items:center;gap:8px;background:var(--paper);border:4px solid var(--ink);border-radius:18px;padding:10px 20px;box-shadow:0 6px 0 var(--ink);font-weight:700;text-align:center}
.actbar.on{display:flex}.actbar small{font-weight:600;opacity:.7}.actbar .pull{animation:pulse .5s ease-in-out infinite;font-size:30px;padding:16px 38px}
.announce{position:fixed;left:50%;top:max(76px,calc(env(safe-area-inset-top) + 66px));transform:translate(-50%,-26px);opacity:0;z-index:70;display:flex;align-items:center;gap:12px;width:max-content;max-width:min(94vw,560px);background:linear-gradient(#fff3b8,#ffd75e);border:4px solid var(--ink);border-radius:18px;padding:10px 18px;box-shadow:0 6px 0 var(--ink);font-weight:700;font-size:clamp(15px,3.9vw,19px);line-height:1.3;pointer-events:none;transition:all .4s}
.announce.on{opacity:1;transform:translate(-50%,0)}.announce .ic{font-size:34px}.announce small{display:block;font-weight:600;font-size:.82em;opacity:.8}.announce.legend{background:linear-gradient(#ffe0f4,#ffb3e6)}.announce.pres{background:linear-gradient(#d9f7e4,#9be8b9)}

tan dan ikan dapat diperbarui bila dijaga. Hasil tambang seperti minyak dan batu bara tidak bisa diperbarui."),6:Ce("Negara Tetangga ASEAN","Pertemuan ASEAN akan dimulai! Kumpulkan nama NEGARA ANGGOTA ASEAN saja.","negara anggota ASEAN",4,["|Malaysia","|Thailand","|Vietnam","|Filipina","|Singapura","|Kamboja"],["|Jepang","|India","|Tiongkok","|Australia","|Korea Selatan"],"ASEAN adalah organisasi negara-negara Asia Tenggara. Jepang, India, dan Tiongkok berada di luar ASEAN.")},mat:{1:Ce("Kartu Bilangan Genap","Kartu angkaku tercecer! Kumpulkan hanya kartu bilangan GENAP.","bilangan genap",4,["|2","|4","|6","|8","|10","|12"],["|1","|3","|5","|7","|9"],"Bilangan genap habis dibagi 2: 2, 4, 6, 8, 10 \u2026 Bilangan ganjil selalu bersisa 1."),2:Ce("Jumlahnya Dua Puluh","Aku butuh pasangan penjumlahan yang hasilnya tepat 20. Bisa bantu?","penjumlahan yang hasilnya 20",4,["|12 + 8","|15 + 5","|11 + 9","|14 + 6","|13 + 7","|10 + 10"],["|12 + 9","|15 + 3","|11 + 7","|14 + 8","|13 + 5"],"Pasangan yang berjumlah 20: 12+8, 15+5, 11+9, 14+6, 13+7, dan 10+10."),3:Ce("Hasil Kali 24","Pak Kepala Toko ingin bilangan 24 dibuat dari perkalian. Kumpulkan yang hasilnya 24!","perkalian yang hasilnya 24",4,["|3 \xD7 8","|4 \xD7 6","|2 \xD7 12","|6 \xD7 4","|8 \xD7 3","|1 \xD7 24"],["|3 \xD7 7","|4 \xD7 5","|5 \xD7 5","|6 \xD7 3","|9 \xD7 2"],"24 = 3\xD78 = 4\xD76 = 2\xD712 = 1\xD724. Perkalian punya sifat tukar tempat: 3\xD78 sama dengan 8\xD73."),4:Ce("Pecahan Senilai","Semua pecahan ini mirip! Kumpulkan yang nilainya SAMA dengan setengah (1/2).","pecahan senilai 1/2",4,["|2/4","|3/6","|4/8","|5/10","|6/12","|10/20"],["|1/3","|2/5","|3/4","|3/5","|5/8"],"Pecahan senilai punya nilai sama: 1/2 = 2/4 = 3/6 = 4/8. Pembilangnya selalu setengah dari penyebutnya."),5:Ce("Perburuan Bilangan Prima","Bilangan prima bersembunyi di sini. Temukan yang PRIMA saja!","bilangan prima",4,["|2","|3","|5","|7","|11","|13","|17","|19"],["|4","|6","|9","|15","|21","|25"],"Bilangan prima hanya habis dibagi 1 dan dirinya sendiri: 2, 3, 5, 7, 11, 13 \u2026 Angka 2 satu-satunya prima yang genap."),6:Ce("Kartu Bilangan Kuadrat","Kumpulkan kartu BILANGAN KUADRAT, yaitu hasil bilangan yang dikali dirinya sendiri!","bilangan kuadrat",4,["|4","|9","|16","|25","|36","|49","|64"],["|8","|12","|20","|30","|50","|60"],"Bilangan kuadrat: 4=2\xB2, 9=3\xB2, 16=4\xB2, 25=5\xB2, 36=6\xB2. Bangun persegi bisa disusun dari bilangan ini.")},ing:{1:Ce("Colours","Hello! My paint box is empty. Please collect the COLOURS (nama warna) for me!","colours (warna)",4,["\u{1F534}|Red","\u{1F535}|Blue","\u{1F7E2}|Green","\u{1F7E1}|Yellow","\u{1F7E0}|Orange","\u{1F7E3}|Purple"],["\u{1F34E}|Apple","\u{1F431}|Cat","\u{1F4DA}|Book","\u{1F697}|Car"],"Red, blue, green, dan yellow adalah nama warna dalam bahasa Inggris."),2:Ce("Fruit Basket","Hello, friend! I need FRUIT for my basket. Can you collect them?","fruit (buah-buahan)",4,["\u{1F34E}|Apple","\u{1F34C}|Banana","\u{1F347}|Grapes","\u{1F34A}|Orange","\u{1F349}|Watermelon","\u{1F353}|Strawberry"],["\u{1F697}|Car","\u{1F4DA}|Book","\u26BD|Ball","\u{1FA91}|Chair"],"Apple, banana, dan grapes semuanya fruit. Di bahasa Inggris, buah juga bisa disebut fruits."),3:Ce("Farm Animals","Welcome to my farm! Please collect the FARM ANIMALS, not the wild ones.","farm animals (hewan ternak)",4,["\u{1F404}|Cow","\u{1F411}|Sheep","\u{1F416}|Pig","\u{1F414}|Chicken","\u{1F434}|Horse","\u{1F986}|Duck"],["\u{1F981}|Lion","\u{1F418}|Elephant","\u{1F42F}|Tiger","\u{1F412}|Monkey"],"Cow, sheep, pig, dan chicken hidup di farm. Lion, tiger, dan elephant adalah hewan liar."),4:Ce("People at Work","Today is Career Day! Collect the words for JOBS (pekerjaan), not the tools.","jobs (pekerjaan)",4,["\u{1F3E5}|Doctor","\u2708\uFE0F|Pilot","\u{1F692}|Firefighter","\u{1F373}|Chef","\u{1F46E}|Police officer","\u{1F33E}|Farmer"],["\u{1F528}|Hammer","\u{1F4D6}|Notebook","\u{1F9F0}|Toolbox","\u{1F4BC}|Briefcase"],"Doctor, pilot, chef, dan farmer adalah jobs. Hammer dan toolbox adalah alat, bukan pekerjaan."),5:Ce("Yesterday I Went\u2026","Let us travel to the past! Collect only the PAST TENSE verbs (kata kerja lampau).","past tense verbs (kata kerja lampau)",4,["|went","|ate","|saw","|took","|wrote","|ran"],["|go","|eat","|see","|take","|write","|run"],"Bentuk lampau: go \u2192 went, eat \u2192 ate, see \u2192 saw, take \u2192 took. Kata kerja ini tidak beraturan (irregular)."),6:Ce("Describing Words","Words can describe things! Collect only the ADJECTIVES (kata sifat).","adjectives (kata sifat)",4,["|beautiful","|tall","|happy","|heavy","|dangerous","|brave"],["|table","|sing","|quickly","|teacher","|tomorrow"],"Adjective menjelaskan benda: a tall tree, a happy girl. Table dan teacher adalah noun, sing adalah verb.")},man:{1:Ce("Angka \u6570\u5B57","\u4F60\u597D! Kartu angkaku hilang. Kumpulkan hanya kartu ANGKA (\u6570\u5B57)!","angka dalam bahasa Mandarin",4,["|\u4E00/y\u012B (1)","|\u4E8C/\xE8r (2)","|\u4E09/s\u0101n (3)","|\u56DB/s\xEC (4)","|\u4E94/w\u01D4 (5)","|\u516D/li\xF9 (6)"],["|\u4EBA/r\xE9n (orang)","|\u5927/d\xE0 (besar)","|\u6C34/shu\u01D0 (air)","|\u5C71/sh\u0101n (gunung)"],"\u4E00 \u4E8C \u4E09 \u56DB \u4E94 \u516D adalah angka satu sampai enam. \u4EBA berarti orang, \u6C34 berarti air."),2:Ce("Keluargaku \u5BB6\u4EBA","\u6211\u7684\u5BB6\u4EBA \u2026 aku sedang menempel foto keluarga. Kumpulkan sebutan ANGGOTA KELUARGA!","anggota keluarga (\u5BB6\u4EBA)",4,["|\u7238\u7238/b\xE0ba (ayah)","|\u5988\u5988/m\u0101ma (ibu)","|\u54E5\u54E5/g\u0113ge (kakak lk)","|\u59D0\u59D0/ji\u011Bjie (kakak pr)","|\u5F1F\u5F1F/d\xECdi (adik lk)","|\u59B9\u59B9/m\xE8imei (adik pr)"],["|\u8001\u5E08/l\u01CEosh\u012B (guru)","|\u5B66\u6821/xu\xE9xi\xE0o (sekolah)","|\u670B\u53CB/p\xE9ngyou (teman)","|\u533B\u751F/y\u012Bsh\u0113ng (dokter)"],"\u7238\u7238 ayah, \u5988\u5988 ibu, \u54E5\u54E5 dan \u59D0\u59D0 kakak, \u5F1F\u5F1F dan \u59B9\u59B9 adik. \u8001\u5E08 adalah guru."),3:Ce("Buah-buahan \u6C34\u679C","Aku suka \u6C34\u679C! Kumpulkan hanya B
