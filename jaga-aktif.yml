# OPSIONAL. Menyentuh database Supabase setiap hari supaya proyek gratis tidak dijeda karena sepi.
# Letakkan berkas ini di repositori GitHub Anda pada folder: .github/workflows/jaga-aktif.yml
# Lalu di GitHub: Settings > Secrets and variables > Actions > New repository secret, buat dua rahasia:
#   SUPABASE_URL  = alamat proyek, contoh https://abcdefghijklmno.supabase.co
#   SUPABASE_KEY  = kunci publishable (sama dengan di config.js)
name: Jaga database tetap aktif
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Panggil database tiga kali
        run: |
          for i in 1 2 3; do
            curl -fsS -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/bs_ping" \
              -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
              -H "Content-Type: application/json" \
              -d '{}'
            echo
            sleep 5
          done
